<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nido Suave — Massage & Ontspanning</title>
    <meta name="description" content="Nido Suave: ontspanningsmassage afgestemd op jouw lichaam en jouw moment. Een plek voor iedereen, waar je even niets hoeft." />
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="gfx/nido_suave_mark.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="NidoSuave.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app"></div>

    <div id="loading-panel" class="loading-panel">
        <img class="loading-panel__logo" src="gfx/nido_suave_illustration.svg" alt="" aria-hidden="true" />
        <div class="loading-panel__brand">Nido <span>Suave</span></div>
        <div class="loading-panel__tagline">Een zachte plek voor groot en klein</div>
    </div>

    <div id="blazor-error-ui">
        Er ging iets mis.
        <a href="" class="reload">Opnieuw laden</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        (function () {
            var panel = document.getElementById('loading-panel');
            var app   = document.getElementById('app');
            var obs   = new MutationObserver(function () {
                if (app.childElementCount > 0) {
                    obs.disconnect();
                    panel.classList.add('loading-panel--exit');
                }
            });
            obs.observe(app, { childList: true });
        }());
    </script>
</body>

</html>
